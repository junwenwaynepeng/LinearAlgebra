name = "LinearAlgebraCourse"
version = "0.1.0"
keywords = ["math", "linear-algebra", "lean"]
defaultTargets = ["LinearAlgebra"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "LinearAlgebra"
